spring.application.name=inventory-service
server.port=8080

# Base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:inventorydb
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Ordre d'initialisation : data.sql s'exécute APRÈS qu'Hibernate crée les tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Kafka - pointe maintenant vers le Kafka déployé dans le cluster Kubernetes
spring.kafka.bootstrap-servers=kubeflux-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092

# Consumer
spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kubeflux.inventoryservice.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.kubeflux.inventoryservice.event.OrderCreatedEvent

# Producer (nécessaire pour la Dead Letter Queue)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer